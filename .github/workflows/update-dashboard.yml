name: Update dashboard and deploy

on:
  schedule:
    # Cada 1 hora (minuto 0)
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Zona horaria de la lotería (ajústala si es necesario)
  TZ: America/Caracas

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape new results
        run: python scrape_incremental.py --file resultados.csv

      - name: Run analysis (generates dashboard)
        run: python analisis.py

      - name: Prepare site for GitHub Pages
        run: |
          mkdir -p _site
          cp v7_output/dashboard.html _site/index.html
          cp v7_output/*.csv _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Commit updated data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.csv v7_output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update results and dashboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
